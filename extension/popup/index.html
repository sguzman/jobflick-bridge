<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jobflick Bridge</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <h1>🦊 Jobflick Bridge</h1>
    <p>Firefox · local jobs</p>
  </header>
  <nav aria-label="Job actions">
    <button id="scan" type="button">Scan visible YAML</button>
    <button id="refresh" type="button">Refresh jobs</button>
    <button id="diagnose" type="button">Check connection</button>
    <button id="probe-upload" type="button">Inspect composer</button>
  </nav>
  <form id="filter-form" role="search" aria-label="Find local Jobflick jobs">
    <input id="filter-query" type="search" aria-label="Find job by name, ID or state" placeholder="Find a saved job" maxlength="128">
    <button type="submit">Find</button>
  </form>
  <p id="notice" role="status" aria-live="polite"></p>
  <main id="jobs" aria-label="Jobs"></main>
  <button id="load-older" type="button" hidden>Load older jobs</button>
  <footer>Reports stay in local Jobflick. Nothing is sent to ChatGPT automatically.</footer>
</body>
</html>

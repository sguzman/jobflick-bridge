name: Firefox Signed XPI — explicit accepted release gate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobflick-bridge-amo-signing
  cancel-in-progress: false

jobs:
  sign:
    # Manual dispatch only on main. Production automation cannot sign
    # or distribute before full live Firefox acceptance.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all prerequisite acceptance evidence
        run: node .github/verify-signing-gate.mjs
      - name: Lint exact production extension before signing
        run: npx --yes web-ext@10.8.0 lint --source-dir extension
      - name: Request Mozilla unlisted XPI signature
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY:-}" || -z "${WEB_EXT_API_SECRET:-}" ]]; then
            echo "Signing credentials missing; no AMO request made" >&2
            exit 1
          fi
          mkdir -p dist/signed
          npx --yes web-ext@10.8.0 sign \
            --source-dir extension --artifacts-dir dist/signed \
            --channel unlisted
      - name: Inspect signed XPI and record SHA-256
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/signed/*.xpi)
          if [[ ${#archives[@]} != 1 ]]; then
            echo "Expected exactly one signed XPI" >&2
            exit 1
          fi
          unzip -tq "${archives[0]}"
          unzip -Z1 "${archives[0]}" | grep -Fx manifest.json
          unzip -Z1 "${archives[0]}" | grep -E "^META-INF/[^/]+"
          sha256sum "${archives[0]}"
      - id: fde
        name: Set up disposable Firefox Developer Edition for signed XPI
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          token: ${{ github.token }}
      - name: Install temporary CI-only WebDriver tooling
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Verify signed XPI survives Firefox process restart
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/signed/*.xpi)
          if [[ ${#archives[@]} != 1 ]]; then
            echo "Expected exactly one Mozilla-signed XPI" >&2
            exit 1
          fi
          export FDE_SIGNED_XPI
          FDE_SIGNED_XPI="$(realpath -e "${archives[0]}")"
          node tests/fde-signed.cjs
      - name: Preserve signed XPI as a review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: jobflick-bridge-mozilla-signed-review
          path: dist/signed/*.xpi
          if-no-files-found: error
          retention-days: 30

name: Firefox Bridge Checks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobflick-bridge-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and invariants
        run: npm run check
      - name: Fish host installer syntax
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 150s apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout 150s apt-get install -y fish jq
          fish --no-execute scripts/install-native-host.fish
          fish --no-execute scripts/qa-firefox-developer.fish
      - name: Disposable Firefox native-host installer smoke
        run: node tests/native-host-installer.test.cjs
      - name: Mozilla WebExtension lint
        run: npx --yes web-ext@10.8.0 lint --source-dir extension
      - name: Build unsigned Firefox QA archive
        run: npx --yes web-ext@10.8.0 build --source-dir extension --artifacts-dir dist --overwrite-dest
      - name: Upload unsigned QA archive
        uses: actions/upload-artifact@v4
        with:
          name: jobflick-bridge-fde-qa-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Manifest parse
        run: node -e 'const m=require("./extension/manifest.json"); if (!m.browser_specific_settings?.gecko?.id) process.exit(1)'

  fde-smoke:
    name: Firefox Developer Edition temporary install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: fde
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
      - name: Install CI-only WebDriver library
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Headless Firefox Developer Edition add-on load
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-smoke.cjs

      - name: Headless Firefox Developer Edition synthetic content-script acceptance
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-synthetic.cjs
      - name: Headless Firefox Developer Edition isolated Native Messaging round trip
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
        run: node tests/fde-native.cjs

  real-jobflick:
    name: Isolated real Jobflick native-host acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned upstream Jobflick for CI only
        uses: actions/checkout@v4
        with:
          repository: sguzman/jobflick
          ref: cbff2a4cb90be4487e1bbb406777cf7fe3b6cc1d
          path: .ci-jobflick
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".ci-jobflick -> target"
          key: real-jobflick-bridge
      - name: Install Fish and native Linux build requirements
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 150s apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout 150s apt-get install -y fish libwayland-dev libxkbcommon-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev pkg-config
      - name: Compile pinned Jobflick
        working-directory: .ci-jobflick
        run: cargo build --locked --bin jobflick
      - name: Real native-host protocol and harmless Fish execution
        env:
          JOBFLICK_QA_BINARY: ${{ github.workspace }}/.ci-jobflick/target/debug/jobflick
        run: node tests/real-jobflick.cjs
      - id: fde
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
      - name: Install CI-only Selenium library
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Firefox Developer Edition to real isolated Jobflick daemon
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
          JOBFLICK_QA_BINARY: ${{ github.workspace }}/.ci-jobflick/target/debug/jobflick
          JOBFLICK_QA_REAL: "true"
        run: node tests/fde-native.cjs

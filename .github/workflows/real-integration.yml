name: Firefox Bridge Real Jobflick Integration
on:
  push:
    branches: [main]
    paths:
      # Only source/protocol changes that affect Firefox -> native execution.
      # Popup-only, mock-only and documentation edits retain fast Firefox CI.
      - "extension/background.js"
      - "extension/content.js"
      - "extension/manifest.json"
      - "tests/fde-native.cjs"
      - "tests/fde-packaged.cjs"
      - "tests/real-jobflick.cjs"
      - "tests/native-frame.test.mjs"
      - "tests/native-host-installer.test.cjs"
      - "tests/fixtures/**"
      # Deliberately exclude local QA/acceptance helper scripts: they must
      # not cause an unrelated pinned Rust backend build.
      - "scripts/install-native-host.fish"
      - "scripts/package-unsigned.fish"
      - "package.json"
      - ".github/workflows/real-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobflick-real-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-jobflick:
    name: Isolated real Jobflick native-host acceptance
    # Pin stable LTS package mirrors; Ubuntu "latest" preview mirror downloads
    # have repeatedly delayed or timed out on the Fish package.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned upstream Jobflick for CI only
        uses: actions/checkout@v4
        with:
          repository: sguzman/jobflick
          ref: cbff2a4cb90be4487e1bbb406777cf7fe3b6cc1d
          path: .ci-jobflick
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".ci-jobflick -> target"
          key: real-jobflick-bridge
      - name: Install Fish and native Linux build requirements
        shell: bash
        run: |
          set -euo pipefail
          packages=(fish jq libwayland-dev libxkbcommon-dev libx11-dev
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev pkg-config)
          # Hosted runner images normally have apt package indexes already.
          # Install from them first; only refresh on a stale/missing-index
          # failure. This avoids an unnecessary full mirror round-trip on
          # every expensive pinned Rust/native-host acceptance run.
          apt_install() {
            sudo env DEBIAN_FRONTEND=noninteractive timeout 240s \
              apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 "${packages[@]}"
          }
          if ! apt_install; then
            sudo env DEBIAN_FRONTEND=noninteractive timeout 240s \
              apt-get update -qq -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            apt_install
          fi
      - name: Verify deterministic unsigned Firefox packaging
        run: |
          fish --no-execute scripts/package-unsigned.fish
          fish scripts/package-unsigned.fish "$RUNNER_TEMP/jobflick-unsigned-one.zip"
          fish scripts/package-unsigned.fish "$RUNNER_TEMP/jobflick-unsigned-two.zip"
          cmp "$RUNNER_TEMP/jobflick-unsigned-one.zip" "$RUNNER_TEMP/jobflick-unsigned-two.zip"
          unzip -tq "$RUNNER_TEMP/jobflick-unsigned-one.zip"
          unzip -Z1 "$RUNNER_TEMP/jobflick-unsigned-one.zip" | grep -Fx manifest.json
          sha256sum "$RUNNER_TEMP/jobflick-unsigned-one.zip"
      - name: Fish launcher syntax and disposable native-host registration
        run: |
          fish --no-execute scripts/install-native-host.fish
          fish --no-execute scripts/qa-firefox-developer.fish
          node tests/native-host-installer.test.cjs
          node --test tests/qa.test.mjs
      - name: Compile pinned Jobflick
        working-directory: .ci-jobflick
        run: cargo build --locked --bin jobflick
      - name: Real native-host protocol and harmless Fish execution
        env:
          JOBFLICK_QA_BINARY: ${{ github.workspace }}/.ci-jobflick/target/debug/jobflick
        run: node tests/real-jobflick.cjs
      - id: fde
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          token: ${{ github.token }}
      - name: Install CI-only Selenium library
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Verify deterministic unsigned package installs in disposable Firefox
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
          FDE_UNSIGNED_ARCHIVE: ${{ runner.temp }}/jobflick-unsigned-qa.xpi
        run: |
          cp "$RUNNER_TEMP/jobflick-unsigned-one.zip" "$RUNNER_TEMP/jobflick-unsigned-qa.xpi"
          node tests/fde-packaged.cjs
      - name: Firefox Developer Edition to real isolated Jobflick daemon
        env:
          FDE_BINARY: ${{ steps.fde.outputs.firefox-path }}
          JOBFLICK_QA_BINARY: ${{ github.workspace }}/.ci-jobflick/target/debug/jobflick
          JOBFLICK_QA_REAL: "true"
        run: node tests/fde-native.cjs
